# ---- JVM ----
# AGP 9 + Gradle 9 需要 JDK 17+；实测 JDK 21 正常，JDK 25 会被 Gradle 9.6 拒绝。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ---- Gradle ----
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：AGP 9 已完全兼容，开启后二次构建显著变快。
# 若遇到某个插件不兼容导致报错，把下面一行改成 false 即可。
org.gradle.configuration-cache=true

# ---- AndroidX ----
android.useAndroidX=true

# ---- AGP 9 built-in Kotlin 与 KSP 的兼容开关（必须保留）----
# KSP 通过 kotlin.sourceSets DSL 注册生成源目录，AGP 9 的 built-in Kotlin 默认禁止这种写法，
# 会导致 ":xxx  Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin."
# 关掉这个限制是目前唯一可用的办法（Room 2.8.5 + KSP 2.2.10-2.0.2 实测可正常编译运行）。
android.disallowKotlinSourceSets=false

# ---- Kotlin ----
kotlin.code.style=official
