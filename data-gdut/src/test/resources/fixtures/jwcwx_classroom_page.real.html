<script>

    $(function () {

    	var today = '2026-09-21';
    	var firstLoad = true;
    	getClassUsed(today)
        // 初始化日期组件
        $("#rq").calendar({
        	value:[today],
        	dateFormat: 'yyyy-mm-dd',
        	onChange: function(p, values, displayValues){
            	if(today != values[0] || !firstLoad){
            		initClass();
        			getClassUsed(values[0]);
        			firstLoad = false;
            	}
            }	
        });


        $('table td').on('click', 'i', function (e) {
            e.stopPropagation();

            if ($(this).hasClass('kx')) {
                // 空闲
                $.alert('可容纳 ' + $(this).attr('data-rnrs') + ' 人', '教室空闲');

            } else {
                var zyxx = $(this).data('info');
                var sytype = zyxx.sytype;
                if (sytype == '1') {
                    var dHtml = '<span>类型:</span>上课占用<br>';
                    dHtml += '<span>课程:</span>' + zyxx.kcmc + '<br>';
                    dHtml += '<span>授课教师:</span>' + zyxx.teaxms + '<br>';
                    dHtml += '<span>节次:</span>' + zyxx.jcdm2 + '<br>';
                    dHtml += '<span>教学班:</span>' + zyxx.jxbmc + '<br>';
                    dHtml += '<span>上课人数:</span>' + zyxx.rs + '<br>';
                    dHtml += '<span>授课内容:</span>' + (zyxx.sknrjj||'');

                    $.alert('<p class="zyyy">' + dHtml + '</p>', '教室被占用');

                } else if (sytype == '2') {
                    var dHtml = '<span>类型:</span>教室被借用<br>';
                    dHtml += '<span>借用人:</span>' + zyxx.teaxms + '<br>';
                    dHtml += '<span>节次:</span>' + zyxx.jcdm2 + '<br>';
                    dHtml += '<span>人数:</span>' + zyxx.rs + '<br>';
                    dHtml += '<span>借用原因:</span>' + zyxx.sknrjj.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');

                    $.alert('<p class="zyyy">' + dHtml + '</p>', '教室被占用');

                } else if (sytype == '3') {

                    $.alert('教室被锁定<br>锁定节次：'+zyxx.jcdm2 );
                } else if (sytype == '4') {

                    $.alert('原因：考试占用<br>占用节次：'+zyxx.jcdm2+'<br>考试人数：'+zyxx.rs, '教室被占用');
                } else {
                    $.alert('原因不明<br>占用节次：'+zyxx.jcdm2, '教室被占用');
                }
            }

        });

        // 初始化教室占用表格
        function initClass() {
			$('#js-table').find('td[data-rnrs]').each(function(){

				$(this).html('<i class="fa fa-check kx" data-rnrs="'+$(this).data('rnrs')+'"></i>');
			});
			
        }

        // 查询教室占用
        function getClassUsed(rq) {
	        utils.get(
	            '/free-class-room/classroomUsedData?jwCode=',
	            {
		            jzwdm: '0005',
					rq: rq
			     },
	            function (res) {
	                utils.dealRes({
	                    result: res,
	                    success: function (data) {
	                        renderUse(data);
	                    }
	                });
	            }
	        );
        }
        
        // 渲染使用情况
        function renderUse(data) {
            if (!data || data.length == 0) {
                return;
            }

            $.each(data, function (i, item) {
                var $zcjObj = $('.qk-' + item.jxcddm + '-' + item.jcdm); // 总的节次匹配

                // 匹配到直接渲染，匹配不到分开节次渲染
                if ($zcjObj.length > 0) {
                    writeUsed($zcjObj, item);
                } else {

                    var jcdm2 = item.jcdm2;
                    if (jcdm2) {
                        $.each(jcdm2.split(','), function (i, jc) {

                            $zcjObj = $('.qk-' + item.jxcddm + '-' + jc);

                            writeUsed($zcjObj, item);
                        });
                    }

                }

            });

        }


        function writeUsed(obj, zyxx) {
            var sytype = zyxx.sytype;
            
            var zhHtml;

            // 判断是否有占用了
            if(obj.find('.kx').length === 1 ){
            	zhHtml = '';
             }else {

                 // 判断是否为同一次的占用
                 if(obj.find('i[data-dm="'+zyxx.dm+'"]').length === 1) {
					return false;
                 }
            	 zhHtml = obj.html();
             }
            
            if (sytype == '1') {
                zhHtml += '<i class="zy" data-dm=\''+zyxx.dm+'\' data-info=\'' + JSON.stringify(zyxx) + '\'>课</i>';
            } else if (sytype == '2') {
                zhHtml += '<i class="zy zy-warn" data-dm=\''+zyxx.dm+'\' data-info=\'' + JSON.stringify(zyxx) + '\'>借</i>';
            } else if (sytype == '3') {
                zhHtml = '<i class="fa fa-lock zy" data-dm=\''+zyxx.dm+'\' data-info=\'' + JSON.stringify(zyxx) + '\'></i>';
            } else if (sytype == '4') {
                zhHtml += '<i class="zy" data-dm=\''+zyxx.dm+'\' data-info=\'' + JSON.stringify(zyxx) + '\'>考</i>';
            } else {
                zhHtml += '<i class="fa fa-remove zy-warn" data-dm=\''+zyxx.dm+'\' data-info=\'' + JSON.stringify(zyxx) + '\'></i>';
            }

            obj.html(zhHtml);
        }

    });

</script>
